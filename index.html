<!DOCTYPE html>
<html>
<head>
  <title>Redirecting...</title>
<meta http-equiv="refresh" content="10; url=//archive.bluepointart.uk/#norwid">  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }
    #countdown {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h1>Redirecting to archive.bluepointart.uk...</h1>
  <p>Please wait <span id="countdown">10</span> seconds...</p>
 
  <script>
    var countdown = 10;
    var interval = setInterval(function() {
      countdown--;
      document.getElementById("countdown").innerHTML = countdown;
      if (countdown === 0) {
        clearInterval(interval);
      }
    }, 1000);
  </script>
</body>
</html>
